<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sabi &amp; Tom — 24.10.2027 — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Norican&family=Alex+Brush&family=Anton&family=Boldonse&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Caveat+Brush&family=Happy+Monkey&family=Dancing+Script:wght@400..700&family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --f-script:'Norican',cursive;
  --f-script2:'Dancing Script',cursive;
  --f-script3:'Alex Brush',cursive;
  --f-display:'Anton',sans-serif;
  --f-display2:'Boldonse',sans-serif;
  --f-body:'DM Mono',monospace;
  --f-poster:'Caveat Brush',cursive;
  --f-ui:'Anonymous Pro',monospace;
  --f-alt:'Happy Monkey',sans-serif;

  --paper:#f7f2e8;
  --paper2:#efe7d8;
  --ink:#22302a;
  --ink-soft:#4d6154;
  --green:#2f5d43;
  --green-d:#1d3b2b;
  --sage:#8aa892;
  --gold:#b0864b;
  --blush:#d8b7a6;
  --line:rgba(34,48,42,.16);
  --note:#b4472e;
  --maxw:760px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
img{max-width:100%}
a{color:var(--green);text-underline-offset:3px}

/* ---------- chrome (prototype only, not site copy) ---------- */
#chrome{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;gap:10px;align-items:center;justify-content:flex-end;
  padding:9px 14px;background:rgba(247,242,232,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);font-family:var(--f-ui);font-size:12px;
}
#chrome .tag{margin-right:auto;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-size:10px}
.btn-chrome{
  font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:5px 10px;border-radius:999px;cursor:pointer;
}
.btn-chrome:hover{border-color:var(--green);color:var(--green)}
.btn-chrome[aria-pressed="true"]{background:var(--note);border-color:var(--note);color:#fff}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{
  font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;
  border:0;background:transparent;color:var(--ink-soft);padding:5px 12px;cursor:pointer;
}
.lang button[aria-current="true"]{background:var(--green);color:var(--paper)}

/* ---------- login gate ---------- */
#gate{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,#3b6b4f 0%,#1d3b2b 60%,#152b1f 100%);
  padding:24px;text-align:center;
}
#gate.gone{opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .7s ease,transform .7s ease}
.envelope{
  width:min(340px,80vw);aspect-ratio:3/2;margin:0 auto 30px;position:relative;
  background:var(--paper2);border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.4);
  animation:float 5s ease-in-out infinite;
}
.envelope::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 49.4%,var(--line) 49.4%,var(--line) 50.6%,transparent 50.6%),
             linear-gradient(-135deg,transparent 49.4%,var(--line) 49.4%,var(--line) 50.6%,transparent 50.6%);
}
.envelope::after{
  content:"";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;background:var(--blush);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.envelope .seal{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font-family:var(--f-script3);font-size:34px;color:#7a4433;z-index:2;line-height:1;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#gate h1{
  font-family:var(--f-script);font-weight:400;font-size:clamp(34px,7vw,58px);
  color:var(--paper);margin:0 0 26px;line-height:1.2;
}
.gate-form{display:flex;flex-direction:column;gap:10px;align-items:center;width:min(320px,86vw);margin:0 auto}
.gate-form label{
  font-family:var(--f-ui);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(247,242,232,.72);
}
.gate-form input{
  width:100%;font-family:var(--f-ui);font-size:16px;letter-spacing:.18em;text-align:center;
  padding:13px 14px;border:1px solid rgba(247,242,232,.35);border-radius:2px;
  background:rgba(247,242,232,.07);color:var(--paper);text-transform:uppercase;
}
.gate-form input:focus{outline:none;border-color:var(--blush);background:rgba(247,242,232,.13)}
.gate-form button{
  width:100%;font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  padding:13px;border:0;border-radius:2px;background:var(--paper);color:var(--green-d);cursor:pointer;
}
.gate-form button:hover{background:var(--blush)}
.gate-hint{font-family:var(--f-ui);font-size:11px;color:rgba(247,242,232,.55);margin-top:14px;line-height:1.6}
.gate-err{font-family:var(--f-ui);font-size:12px;color:var(--blush);min-height:18px}
.lang-dark{margin-top:22px;border-color:rgba(247,242,232,.3)}
.lang-dark button{color:rgba(247,242,232,.65)}
.lang-dark button[aria-current="true"]{background:var(--paper);color:var(--green-d)}

/* ---------- layout ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:74px 22px 120px}
section{padding:64px 0;border-top:1px solid var(--line);position:relative}
section:first-of-type{border-top:0}
.snum{
  position:absolute;top:64px;left:-54px;font-family:var(--f-ui);font-size:10px;
  letter-spacing:.18em;color:var(--sage);
}
@media(max-width:900px){.snum{position:static;display:block;margin-bottom:10px}}

/* type roles, straight from the per-section doc annotations */
.t-script{font-family:var(--f-script);font-weight:400;line-height:1.25}
.t-script2{font-family:var(--f-script2);font-weight:600;line-height:1.3}
.t-display{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.t-poster{font-family:var(--f-poster);line-height:1.15}
.t-ui{font-family:var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.t-body{font-family:var(--f-body)}

h2{margin:0 0 22px;font-weight:400}
h2.t-script{font-size:clamp(30px,5.4vw,44px);color:var(--green)}
h2.t-script2{font-size:clamp(28px,5vw,40px);color:var(--green)}
h2.t-display{font-size:clamp(24px,4.4vw,34px);color:var(--ink)}
h2.t-poster{font-size:clamp(30px,5.6vw,46px);color:var(--green)}
p{margin:0 0 16px}
.lead{font-size:15px}
.quiet{color:var(--ink-soft)}

/* hero */
#s02{text-align:center;padding-top:26px}
#s02 .kicker{font-family:var(--f-script);font-size:clamp(28px,5.6vw,44px);color:var(--green)}
#s02 .names{font-family:var(--f-display);font-size:clamp(52px,15vw,120px);letter-spacing:.01em;margin:6px 0 18px;text-transform:uppercase}
#s02 .scroll{font-family:var(--f-ui);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}

/* countdown */
#s03{text-align:center}
.cd-pre{font-family:var(--f-display);font-size:clamp(18px,3.4vw,26px);text-transform:uppercase;letter-spacing:.04em}
.cd-quote{font-family:var(--f-script);font-size:clamp(34px,7vw,58px);color:var(--green);margin:2px 0 26px}
.cd-grid{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.cd-cell{min-width:78px;padding:12px 8px;border:1px solid var(--line);border-radius:3px;background:var(--paper2)}
.cd-cell b{display:block;font-family:var(--f-poster);font-size:34px;font-weight:400;color:var(--green);line-height:1}
.cd-cell span{font-family:var(--f-ui);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}

/* placeholders for missing art */
.ph{
  border:1px dashed var(--sage);border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(138,168,146,.11) 9px,rgba(138,168,146,.11) 18px);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--f-ui);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);
  padding:16px;min-height:150px;
}
.ph-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
@media(max-width:560px){.ph-row{grid-template-columns:1fr}}
.ph-tv{aspect-ratio:4/3;margin:22px 0}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:16px 0;border-bottom:1px dotted var(--line)}
.tl li:last-child{border-bottom:0}
.tl .time{font-family:var(--f-poster);font-size:26px;color:var(--gold);line-height:1.1}
.tl .name{font-family:var(--f-script);font-size:25px;color:var(--green);line-height:1.15}
.tl .desc{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}
@media(max-width:560px){.tl li{grid-template-columns:1fr;gap:2px}}

/* callouts */
.card{border:1px solid var(--line);border-radius:3px;background:var(--paper2);padding:20px 22px;margin:22px 0}
.rates{list-style:none;margin:8px 0 0;padding:0}
.rates li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dotted var(--line)}
.rates li:last-child{border-bottom:0}
.code-chip{
  display:inline-block;font-family:var(--f-ui);letter-spacing:.16em;text-transform:uppercase;
  background:var(--green);color:var(--paper);padding:4px 12px;border-radius:2px;font-size:13px;
}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{
  font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--green);color:var(--green);background:transparent;
  padding:10px 16px;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;
}
.btn:hover{background:var(--green);color:var(--paper)}
.btn.solid{background:var(--green);color:var(--paper)}
.btn.solid:hover{background:var(--green-d);border-color:var(--green-d)}

/* stamp / gifts */
.stamp{
  width:140px;height:170px;border:2px dashed var(--gold);border-radius:4px;background:var(--paper2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;font-family:var(--f-ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);text-align:center;padding:12px;
}
.stamp:hover{background:#fff}
.stamp .big{font-family:var(--f-script3);font-size:40px;color:var(--gold);letter-spacing:0;text-transform:none}
.bank{display:none;margin-top:14px}
.bank.open{display:block}

/* faq */
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{
  cursor:pointer;list-style:none;padding:15px 30px 15px 0;position:relative;
  font-family:var(--f-script);font-size:22px;color:var(--green);line-height:1.3;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:15px;font-family:var(--f-ui);font-size:18px;color:var(--sage)}
.faq details[open] summary::after{content:"–"}
.faq .ans{padding:0 0 18px;font-size:14px;color:var(--ink-soft)}

/* forms */
.field{margin:0 0 20px}
.field > label,.qlabel{
  display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:8px;
}
.req{color:var(--note)}
input[type=text],textarea{
  width:100%;font-family:var(--f-body);font-size:14px;padding:11px 12px;
  border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);
}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--green)}
textarea{min-height:84px;resize:vertical}
.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--green)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
@media(max-width:560px){.chips{grid-template-columns:1fr}}
.guest-block{border:1px solid var(--line);border-radius:3px;padding:16px 18px;margin:0 0 14px;background:var(--paper2)}
.guest-block h4{margin:0 0 12px;font-family:var(--f-script);font-weight:400;font-size:22px;color:var(--green)}
.guest-block[hidden]{display:none}
.sent{
  display:none;border:1px solid var(--green);background:#fff;border-radius:3px;padding:18px 20px;margin-top:18px;
  font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;color:var(--green);
}
.sent.show{display:block}

/* dev notes */
.note{
  display:none;border-left:3px solid var(--note);background:rgba(180,71,46,.07);
  padding:10px 14px;margin:14px 0;font-family:var(--f-ui);font-size:11.5px;line-height:1.65;color:#7d3020;
  letter-spacing:.01em;
}
body.notes .note{display:block}
.note b{letter-spacing:.1em;text-transform:uppercase;font-size:10px;display:block;margin-bottom:3px}


/* ---------- template graphics ---------- */
.deco{position:absolute;pointer-events:none;user-select:none;z-index:1}
section{overflow:visible}
.star{width:34px;opacity:.9}
.star.s{width:22px}
.star.l{width:52px}
#gate{background:#1d3b2b}
#gate .gbg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:brightness(.55) saturate(1.05);
}
#gate .gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(29,59,43,.25) 0%,rgba(21,43,31,.8) 100%)}
#gate > div{position:relative;z-index:2}
#gate .gstar{position:absolute;z-index:3;pointer-events:none}
#s02{
  position:relative;color:var(--paper);border-radius:6px;overflow:hidden;
  padding:78px 26px 64px;margin-top:6px;
}
#s02 .hbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.62)}
#s02 .hbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,43,31,.35),rgba(21,43,31,.6))}
#s02 > *{position:relative;z-index:2}
#s02 .kicker{color:#f2d9a8}
#s02 .names{color:var(--paper);text-shadow:0 2px 20px rgba(0,0,0,.35)}
#s02 .scroll{color:#f2d9a8}
#s02 .barstars{display:block;margin:16px auto 0;max-width:420px;opacity:.95}
.cdband{position:relative;border-radius:6px;overflow:hidden;padding:30px 18px;margin-top:6px}
.cdband .cbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.45) saturate(.9)}
.cdband > *{position:relative;z-index:2}
.cdband .cd-pre{color:#f7f2e8}
.cdband .cd-quote{color:#f2d9a8}
.cdband .cd-cell{background:rgba(247,242,232,.92);border-color:rgba(247,242,232,.5)}
.ill{display:block;margin:0 auto;max-width:100%}
.ill-row{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin:26px 0}
.iconrow{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;margin:22px 0}
.iconrow img{width:56px;height:auto}
.framed{position:relative;max-width:460px;margin:26px auto}
.framed .fimg{display:block;width:86%;margin:0 auto;border-radius:3px}
.framed .fov{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.tvwrap{position:relative;max-width:560px;margin:26px auto}
.tvwrap .tvov{display:block;width:100%}
.tvwrap .tvscreen{
  position:absolute;left:12.5%;top:13%;width:75%;height:60%;
  background:#243a2c;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:#cbe0d1;font-family:var(--f-ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:10px;
}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}
.gallery img{width:100%;height:150px;object-fit:cover;border-radius:3px;display:block}
.gallery img:first-child{grid-column:1 / -1;height:230px}
@media(max-width:560px){.gallery{grid-template-columns:1fr 1fr}.gallery img{height:120px}}
.tl li{grid-template-columns:104px 62px 1fr}
.tl .tlicon{width:54px;height:auto;align-self:center}
@media(max-width:560px){.tl li{grid-template-columns:1fr}.tl .tlicon{width:46px}}
.menurow{display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:start;padding:12px 0;border-bottom:1px dotted var(--line)}
.menurow:last-child{border-bottom:0}
.menurow img{width:76px;height:auto}
.menurow p{margin:0}

.stampimg{width:150px;cursor:pointer;transition:transform .2s}
.stampimg:hover{transform:rotate(-3deg) scale(1.03)}
.contactline{display:flex;gap:10px;align-items:center;margin:4px 0}
.contactline img{width:26px}
.polaroids{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.polaroids img{width:190px}
.faqdeco{display:block;margin:0 auto 10px;max-width:220px;opacity:.9}
.waxrow{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.waxrow img{width:74px}


.iconrow img{width:auto;height:52px}
.tl .tlicon{width:auto;height:56px;justify-self:center}
.menurow{grid-template-columns:70px 1fr}
.menurow img{width:auto;height:66px;justify-self:center}
.bico{width:auto;height:16px;vertical-align:-3px;margin-right:7px}
.contactline img{width:auto;height:24px}
.star{width:auto;height:34px}
.star.s{height:22px}
.star.l{height:52px}
#gate .gstar{height:auto}
.faqdeco{max-width:180px}
.waxrow img{width:auto;height:70px}
.polaroids img{width:auto;height:210px}

footer{
  max-width:var(--maxw);margin:0 auto;padding:0 22px 60px;
  font-family:var(--f-ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);text-align:center;
}
</style>
</head>
<body class="locked">

<div id="chrome" hidden>
  <span class="tag" id="chromeTag">Prototype · copy + language switch only</span>
  <button class="btn-chrome" id="notesBtn" aria-pressed="false">Notes</button>
  <button class="btn-chrome" id="lockBtn">Lock</button>
  <span class="lang">
    <button data-lang="en" aria-current="true">EN</button>
    <button data-lang="es" aria-current="false">ES</button>
  </span>
</div>

<div id="gate">
  <div class="gbg" style="background-image:url(assets/bg-garden.webp)"></div>
  <img class="gstar" src="assets/star-yellow.webp" alt="" style="width:74px;left:6%;top:22%">
  <img class="gstar" src="assets/star-pastel.webp" alt="" style="width:52px;right:8%;top:30%">
  <img class="gstar" src="assets/star-pastel.webp" alt="" style="width:38px;left:12%;bottom:22%">
  <img class="gstar" src="assets/star-yellow.webp" alt="" style="width:44px;right:12%;bottom:18%">
  <div>
    <div class="envelope"><span class="seal">S&amp;T</span></div>
    <h1 id="gateTitle">You've got a mail!</h1>
    <form class="gate-form" id="gateForm">
      <label id="gateLabel" for="code">Invitation code</label>
      <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="SABITOM">
      <div class="gate-err" id="gateErr"></div>
      <button type="submit" id="gateBtn">Open invitation</button>
    </form>
    <p class="gate-hint" id="gateHint">Prototype — no backend. Any code opens the site.</p>
    <span class="lang lang-dark">
      <button data-lang="en" aria-current="true">EN</button>
      <button data-lang="es" aria-current="false">ES</button>
    </span>
  </div>
</div>

<main id="site" hidden></main>
<footer id="foot" hidden></footer>

<script>
/* ============================================================
   COPY — extracted 2026-08-11 from the per-section Google Docs
   (SITE-COPY.md). Wording is verbatim, including the Spanish
   "ustedes" register that is still due to be rewritten in M0.
   ============================================================ */
const COPY = {
en:{
  chrome:{tag:"Prototype · shared copy · contact + bank details redacted", notes:"Notes", lock:"Lock"},
  gate:{title:"You've got a mail!", label:"Invitation code", btn:"Open invitation",
        hint:"Prototype — no backend. Any code opens the site.",
        err:"Please enter your invitation code."},
  nav:{},
  s02:{kicker:"We are getting married!", names:"Sabi & Tom", scroll:"Scroll down to rsvp"},
  s03:{pre:"Days until we say", quote:"“I do”",

  s06:{title:"A few words", p:[
    "After eight years of sharing adventures, unforgettable moments, and building our life together, the time has finally come to celebrate one of the most special days of our journey.",
    "Along the way, we have grown together, created countless memories, and experienced the greatest adventure of all: building our family with the arrival of Mateo.",

    "Thank you for being part of our journey and for sharing this very special day with us."]},
  s07:{title:"Are you travelling from the UK?", p:[

  s16:{title:"FAQs", q:[
    ["When should I RSVP?","Please confirm your attendance by June 24th, 2027, using the RSVP form on this website. After this date, we will assume that you are unable to join us, and we will confirm the final guest numbers with the hotel so they can prepare all the details for our wedding. We will send you a reminder one week before via WhatsApp."],
    ["What happens if I can no longer attend after the RSVP deadline?","We understand that life can change and that unexpected situations can sometimes happen. If you have confirmed your attendance, we would truly appreciate it if you could keep your commitment to celebrate with us, as after the RSVP deadline we must confirm final numbers with the hotel and make the necessary arrangements. If something unavoidable comes up and you are no longer able to attend, please let us know as soon as possible so we can inform the hotel and make any necessary changes."],
    ["What time should I arrive for the ceremony?","We recommend arriving with enough time to find your seat and enjoy the beginning of the ceremony without rushing. As a guide, please aim to arrive approximately 30 minutes before the ceremony starts. We will confirm the final timing with the hotel closer to the date."],
    ["Do we need to travel to a church or another location?","No. The ceremony, reception, and celebration afterwards will all take place within the Hotel Botánico grounds, so there will be no need to travel to another location."],
    ["Is parking available for guests?","The hotel does not have private parking available for wedding guests, but there are several parking areas with plenty of spaces nearby. As the wedding will take place on a Sunday, we do not expect parking to be an issue. However, we recommend arriving with enough time to find a space and arrive at the ceremony relaxed."],
    ["Are children invited?","Of course! Children are more than welcome. We want this celebration to be a day for everyone, so it will be a completely family-friendly event. We have also arranged entertainment for the little ones, so they can have fun while parents can relax and enjoy the celebration."],
    ["Will there be an open bar?","Yes. We have arranged two hours of open bar after the meal so you can enjoy a drink and continue celebrating with us. After this time, you can purchase your own drinks in the hall bar. Drinks from outside are not allowed in the venue."],
    ["Can I bring a plus-one who is not included on my invitation?","We are very sorry, but we are unable to accommodate additional guests as we have had to carefully limit the number of attendees for our celebration. All invited guests are listed in the RSVP form on this website. Please only select the members of your group who will be attending and leave unselected anyone who is unable to join us."],
    ["Can I take photos during the ceremony?","Of course! We would love for you to capture special moments from our day and share the celebration from your perspective. We have arranged a digital disposable camera through POV. You will find a QR code on your seat (one for each guest, placed on your plate) which you can scan to upload and share 10 special photos and videos of the day. We are happy for you to share photos from the wedding on social media — in fact, we would love to see the day through your eyes. We only ask that you please respect everyone's privacy and only share photos of people who you know are comfortable appearing online. We also kindly ask that you do not share photos of children unless you have permission from their parents, to help protect their privacy. Thank you so much for helping us create these special memories together!"],
    ["Can I bring my own drinks or alcohol?","For organisational reasons and in accordance with the hotel's policies, bringing your own drinks or alcohol into the venue is not permitted. We invite you to enjoy the drinks options we have arranged with the hotel during the celebration."],
    ["Do you provide transport to and from the wedding?","We won't be providing transport, but we're more than happy to help you organise it. If a group of you would like to travel together, we can help arrange shared taxis or larger vehicles where needed. If you're staying in Puerto de la Cruz, the hotel is only about 5 minutes by car from the town centre, so getting to and from the venue is quick and easy. Just let us know if you need any help — we'll be happy to assist."],
    ["Can I choose between different menu options?","We have created a set menu for our celebration, so there will not be different main course options to choose from. The main course includes beef. If you do not eat beef, please choose the vegetarian option in the RSVP form. Children under 10 will automatically be given the children menu which includes chicken. Those aged 10 to 17 will be able to choose between the children's menu, the adult menu, or the vegetarian menu when completing their RSVP. If you have any allergies or intolerances, please select them using the checkbox in the RSVP. If you have any other dietary requirements, please let us know in the notes section."]]},

  s07:{title:"¿Vienen desde la Península?", p:[

  s08:{title:"¿Dónde?", p:[
    "Nuestra boda tendrá lugar en los jardines del precioso Hotel Botánico & The Oriental Spa Garden, en Puerto de la Cruz, Tenerife.",
    "Un lugar muy especial para nosotros, donde celebraremos este día tan importante rodeados de naturaleza, tranquilidad y belleza.",
    "No podríamos haber imaginado un escenario mejor para nuestra boda, ni un equipo más increíble para ayudarnos a hacer realidad este día. Nos sentimos enormemente agradecidos de poder celebrarlo aquí y estamos deseando compartir este lugar único con ustedes."],

  s09:{title:"Descansen y relájense", p:[
    "Si quieren disfrutar de la experiencia completa y alojarse en el mismo lugar donde celebraremos nuestra boda, nuestros invitados disponen de una tarifa especial en el Hotel Botánico & The Oriental Spa Garden.",
    "Además, si tienen pensado aprovechar al máximo la barra libre, les recomendamos alojarse en el hotel para que solo tengan que preocuparse de disfrutar de la celebración y no de cómo volver. Y, por supuesto, ¡nos encantará volver a verlos a todos en el desayuno de la mañana siguiente, relajarnos junto a la piscina… y ponernos al día con todos los cotilleos de la boda!"],

  s11:{title:"MENÚ", p:[
    "Hemos preparado una experiencia gastronómica muy especial para este día.",

  s16:{title:"Preguntas frecuentes", q:[
    ["¿Cuándo debo contestar la invitación?","Te pedimos que confirmes tu asistencia antes del 24 de junio de 2027 a través del formulario de confirmación de esta web. Después de esa fecha, entenderemos que no podrás acompañarnos y enviaremos el número final de invitados al hotel para poder organizar todos los detalles de la boda. Te enviaremos un recordatorio una semana antes a través de WhatsApp para que no se te olvide."],
    ["¿Qué pasa si después de la fecha límite ya no puedo asistir?","Sabemos que la vida puede cambiar y que a veces pueden surgir imprevistos fuera de nuestro control. Si has confirmado tu asistencia, te agradeceríamos mucho que intentaras mantener tu compromiso de acompañarnos ese día, ya que después de la fecha límite debemos confirmar el número final de invitados con el hotel y realizar los pagos correspondientes. Si finalmente ocurre algo que te impida venir, por favor avísanos lo antes posible para poder comunicarlo al hotel y hacer los cambios necesarios."],
    ["¿A qué hora debo llegar a la ceremonia?","Te recomendamos llegar con tiempo suficiente para poder encontrar tu sitio y disfrutar del comienzo de la ceremonia sin prisas. Como referencia, intenta llegar aproximadamente 30 minutos antes de la hora de inicio. Confirmaremos este horario más adelante con el hotel."],
    ["¿Tenemos que desplazarnos a la iglesia o a otro lugar después de la ceremonia?","No. La ceremonia, el banquete y la celebración posterior tendrán lugar en el propio recinto del Hotel Botánico, por lo que no será necesario desplazarse a ningún otro sitio."],
    ["¿Hay aparcamiento disponible para los invitados?","El hotel no dispone de aparcamiento propio para invitados, pero hay varias zonas de parking con muchas plazas disponibles en los alrededores. Al ser domingo, no esperamos que haya problemas para encontrar sitio, pero te recomendamos llegar con tiempo suficiente para poder aparcar con tranquilidad antes de la ceremonia."],
    ["¿Los niños están invitados?","¡Por supuesto! Los niños son más que bienvenidos. Queremos que esta celebración sea una fiesta para todos, por eso será un evento totalmente adaptado para familias. Además, hemos contratado entretenimiento infantil para que los más pequeños puedan divertirse y los padres puedan relajarse un poco también."],
    ["¿Habrá barra libre?","Sí. Hemos contratado dos horas de barra libre para que podáis disfrutar de una copa después de la comida y seguir celebrando con nosotros. Después de ese tiempo, podéis comprar vuestras bebidas en el bar del hall. No se pueden traer bebidas del exterior."],
    ["¿Puedo llevar un acompañante que no aparece en mi invitación?","Sentimos mucho no poder ofrecer invitados adicionales, pero hemos tenido que limitar el número de asistentes para poder organizar la celebración. Todas las personas invitadas aparecen en el formulario de confirmación de esta web. Por favor, selecciona únicamente las personas de tu grupo que asistirán y no marques aquellas que finalmente no puedan venir."],
    ["¿Puedo sacar fotos durante la ceremonia?","¡Por supuesto! Nos encantará que capturéis momentos especiales de este día y que podáis compartir la celebración desde vuestra perspectiva. Hemos creado una cámara desechable digital con POV. Encontraréis un código QR en vuestro asiento (uno para cada invitado sobre el plato) que podréis escanear para subir y compartir 10 fotos y vídeos de momentos especiales del día. No nos importa que compartáis fotos de la boda en vuestras redes sociales; al contrario, nos hará mucha ilusión ver cómo vivisteis este día. Solo os pedimos que tengáis en cuenta la privacidad de los demás invitados y que compartáis imágenes únicamente de personas que sepáis que están cómodas apareciendo en redes sociales. Os pedimos también, por favor, que no compartáis fotografías de menores salvo que tengáis el consentimiento de sus padres, para proteger su privacidad. ¡Muchas gracias por ayudarnos a crear este recuerdo tan especial juntos!"],
    ["¿Puedo traer bebidas o alcohol de fuera?","Por motivos de organización y de acuerdo con las normas del hotel, no está permitido traer bebidas o alcohol de fuera del recinto. Os invitamos a disfrutar de las opciones de bebida que ha preparado el hotel durante la celebración."],
    ["¿Habrá transporte para ir y volver de la boda?","No organizaremos transporte, pero estaremos encantados de ayudaros a organizarlo. Si sois un grupo y queréis compartir taxi o necesitáis un vehículo más grande, podemos ayudaros a gestionarlo. Si os alojáis en Puerto de la Cruz, el hotel está a solo 5 minutos en coche del centro, por lo que llegar y volver es muy sencillo. Si necesitáis cualquier ayuda para organizar el transporte, ¡solo tenéis que decírnoslo!"],
    ["¿Puedo elegir entre diferentes opciones de menú?","El hotel ha preparado un único menú para la celebración, por lo que no habrá diferentes opciones para elegir. El plato principal del menú adulto incluye carne de ternera. Si no consumes carne de ternera, por favor, elige la opción vegetariana en el formulario de confirmación. Los niños menores de 10 años tendrán asignado automáticamente el menú infantil, que incluye pollo. Los invitados de entre 10 y 17 años podrán elegir entre el menú infantil, el menú de adulto o el menú vegetariano al completar el formulario de confirmación. Si tienes alguna alergia o intolerancia, selecciónala utilizando la casilla correspondiente en el formulario de confirmación. Si tienes cualquier otro requisito dietético, por favor indícalo en el apartado de notas."]]},

 s07:{en:"Heading is UK-specific in EN and Península-specific in ES — these are different audiences, not translations of each other. Intentional?"},
 s09:{en:"The Spanish doc opens with a stray drafting line (\"Perfecto, entonces queda aún más directo:\") — removed here, must not be published."},
 s10:{en:"Send-off reads 23:00 here. The planning notes have it at 22:00. Party starts 20:00 with two hours of open bar, which fits 22:00. Needs a decision."},
 s12:{en:"An older draft says \"Elegant Casual\". Garden Formal is the newer, locked wording and is what is shown."},
 s13:{en:"Account details are <strong>masked</strong> in this prototype — it has no real login. In the doc they sit behind the invitation gate; confirm that is intended. Sabi's Bizum number is still missing."},
 s16:{en:"Source numbering was broken in both languages (EN jumped 10 → 12 → 11) — renumbered. Both docs also opened with a leftover drafting line, removed."},
 s16b:{en:"FAQ 12 promises 10–17 year-olds a choice of children's / adult / vegetarian menu. The RSVP form below only offers vegetarian yes-no. One of them has to change — this is the biggest open conflict."},
 s17:{en:"Built exactly as written in the doc, so the age-band mismatch above is visible. Guest names are invented demo data; the real list comes from the invitation code."},
 lang:{en:"Spanish is shown verbatim as extracted. Sections use <em>ustedes</em>; the FAQs and Gifts use <em>tú/vosotros</em>. You locked vosotros/tú — the rewrite is M0 work and is deliberately not done here."}
};

const TLICONS = ['tl-ceremony','tl-cocktail','tl-meal','tl-cake','tl-party','tl-angel'];
const MENUILL  = [null,'menu-cocktail','menu-mainmeal','menu-cake','menu-nightsnacks','menu-appetizers'];
const KEY = 'sabitom.code';
let MEMCODE = null;
function saveCode(v){ try{ localStorage.setItem(KEY,v); }catch(e){ MEMCODE=v; } }
function readCode(){ try{ return localStorage.getItem(KEY); }catch(e){ return MEMCODE; } }
function clearCode(){ try{ localStorage.removeItem(KEY); }catch(e){ MEMCODE=null; } }

const A='assets/';
const img=(n,cls,alt)=>`<img src="${A}${n}.webp" class="${cls||''}" alt="${alt||''}" loading="lazy" decoding="async">`;
const star=(n,css,cls)=>`<img src="${A}${n}.webp" class="deco star ${cls||''}" style="${css}" alt="" loading="lazy">`;
const esc = s => String(s);
const note = k => `<div class="note"><b>Open question</b>${NOTES[k].en}</div>`;
const paras = a => a.map(p=>`<p>${p}</p>`).join('');
const phs = a => `<div class="ph-row">${a.map(x=>`<div class="ph">${x}</div>`).join('')}</div>`;

function sec(n,id,inner){
  return `<section id="${id}"><span class="snum">${String(n).padStart(2,'0')}</span>${inner}</section>`;
}

function wire(){
  const stamp = document.getElementById('stamp');
  if(stamp) stamp.onclick = () => document.getElementById('bank').classList.toggle('open');

  const songBtn = document.getElementById('songBtn');
  if(songBtn) songBtn.onclick = () => document.getElementById('songOk').classList.add('show');

  const rsvpBtn = document.getElementById('rsvpBtn');
  if(rsvpBtn) rsvpBtn.onclick = () => document.getElementById('rsvpOk').classList.add('show');

  const all = document.getElementById('all');
  const who = [...document.querySelectorAll('.who')];
  const syncGuests = () => {
    who.forEach(c=>{
      const b = document.querySelector(`.guest-block[data-g="${c.dataset.i}"]`);
      if(b) b.hidden = !c.checked;
    });
  };
  if(all){
    all.onchange = () => { who.forEach(c=>c.checked = all.checked); syncGuests(); };
    who.forEach(c=>c.onchange = () => { all.checked = who.every(x=>x.checked); syncGuests(); });
  }
  // attending yes/no hides the rest
  document.querySelectorAll('input[name=going]').forEach(r=>{
    r.onchange = () => {
      const going = document.querySelector('input[name=going]:checked').value === 'y';
      document.getElementById('menuBlock').style.display = going ? '' : 'none';
    };
  });
  syncGuests();
}

function tick(){
  const cd = document.getElementById('cd');
  if(!cd) return;
  const diff = Math.max(0, TARGET - new Date());
  const s = Math.floor(diff/1000);
  const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
  cd.querySelectorAll('.cd-cell b').forEach((b,i)=> b.textContent = v[i]);
}
setInterval(tick, 1000);

/* gate + chrome */
document.getElementById('gateForm').addEventListener('submit', e=>{
  e.preventDefault();
  const v = document.getElementById('code').value.trim();
  if(!v){ document.getElementById('gateErr').textContent = COPY[LANG].gate.err; return; }
  saveCode(v);
  unlock();
});
function unlock(){
  document.getElementById('gate').classList.add('gone');
  document.body.classList.remove('locked');
  document.getElementById('chrome').hidden = false;
  document.getElementById('site').hidden = false;
  document.getElementById('foot').hidden = false;
}
function lock(){
  clearCode();
  document.getElementById('gate').classList.remove('gone');
  document.body.classList.add('locked');
  document.getElementById('chrome').hidden = true;
  document.getElementById('site').hidden = true;
  document.getElementById('foot').hidden = true;
  document.getElementById('code').value = '';
  document.getElementById('gateErr').textContent = '';
  window.scrollTo(0,0);
}
document.getElementById('lockBtn').onclick = lock;
document.getElementById('notesBtn').onclick = e => {
  const on = document.body.classList.toggle('notes');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true':'false');
};
document.addEventListener('click', e=>{
  const b = e.target.closest('.lang button');
  if(!b) return;
  LANG = b.dataset.lang;
  render();
});

render();
// remembered code re-opens the site until Lock is pressed
(function(){
  const saved = readCode();
  if(saved){
    document.getElementById('code').value = saved;
    const g = document.getElementById('gate');
    g.style.transition = 'none';
    unlock();
    requestAnimationFrame(()=>{ g.style.transition = ''; });
  }
})();
</script>
