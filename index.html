<script>
/* ---- stage 1 ---- */
(()=>{

const COPY={
 en:{head:'TIMELINE',
     note:'Please arrive at 12:30 to the hotel and come with plenty of time to park and get to the hotel so everything runs smoothly.',
     items:[['13:00','Ceremony','We will begin the celebration with the ceremony in the hotel gardens.','tl-ceremony'],
            ['14:00','Cocktail Reception','Welcome drinks and canapés in the gardens.','tl-cocktail'],
            ['15:00','Wedding Breakfast','A seated wedding meal will be served in the main dining room.','tl-meal'],
            ['19:00','Cake Cutting','Cake cutting.','tl-cake'],
            ['20:00','Party','Dancing, two hours of open bar, and music to enjoy the evening.','tl-party'],
            ['22:00','Send Off','End of the celebration.','tl-angel']]},
 es:{head:'HORARIO',
     note:'Por favor, lleguen al hotel a las 12:30, con tiempo suficiente para aparcar con tranquilidad y que todo fluya sin contratiempos.',
     items:[['13:00 h','Ceremonia','Comenzaremos la celebración con la ceremonia en los jardines del hotel.','tl-ceremony'],
            ['14:00 h','Cóctel','Cóctel de bienvenida con aperitivos en los jardines.','tl-cocktail'],
            ['15:00 h','Comida','Banquete servido en el salón principal.','tl-meal'],
            ['19:00 h','Tarta','Corte de la tarta nupcial.','tl-cake'],
            ['20:00 h','Fiesta','Baile, barra libre durante dos horas y música para disfrutar de la noche.','tl-party'],
            ['22:00 h','Despedida','Fin de la celebración.','tl-angel']]}
};
/* ---- wavy panel edge -------------------------------------------------
   Samples a rounded rectangle by arc length, pushes each sample out along
   its normal by a sine, then smooths the samples with Catmull-Rom curves.
   Wavelength is fixed in pixels and the wave count is rounded to a whole
   number, so bumps stay the same size and the sine closes without a kink
   no matter how tall or wide the panel gets.                            */
const WAVE = { len: 190, amp: 17, radius: 54, step: 7 };

function roundedRectSampler(w, h, r){
  r = Math.min(r, w/2, h/2);
  const segs = [];
  const line = (x1,y1,x2,y2) => ({kind:'l', x1,y1,x2,y2, len: Math.hypot(x2-x1, y2-y1)});
  const arc  = (cx,cy,a0,a1) => ({kind:'a', cx,cy,a0,a1, len: Math.abs(a1-a0)*r});
  segs.push(line(r, 0, w-r, 0));
  segs.push(arc(w-r, r, -Math.PI/2, 0));
  segs.push(line(w, r, w, h-r));
  segs.push(arc(w-r, h-r, 0, Math.PI/2));
  segs.push(line(w-r, h, r, h));
  segs.push(arc(r, h-r, Math.PI/2, Math.PI));
  segs.push(line(0, h-r, 0, r));
  segs.push(arc(r, r, Math.PI, Math.PI*1.5));
  const total = segs.reduce((a,s)=>a+s.len, 0);
  return { total, at(s){
    s = ((s % total) + total) % total;
    for(const g of segs){
      if(s > g.len){ s -= g.len; continue; }
      if(g.kind === 'l'){
        const u = g.len ? s/g.len : 0;
        const dx = (g.x2-g.x1)/(g.len||1), dy = (g.y2-g.y1)/(g.len||1);
        return { x: g.x1 + (g.x2-g.x1)*u, y: g.y1 + (g.y2-g.y1)*u, nx: dy, ny: -dx };
      }
      const a = g.a0 + (g.a1-g.a0) * (g.len ? s/g.len : 0);
      return { x: g.cx + Math.cos(a)*r, y: g.cy + Math.sin(a)*r, nx: Math.cos(a), ny: Math.sin(a) };
    }
    return { x:0, y:0, nx:0, ny:0 };
  }};
}

function wavePath(w, h){
  const inset = WAVE.amp + 3;
  const iw = Math.max(1, w - inset*2), ih = Math.max(1, h - inset*2);
  const S = roundedRectSampler(iw, ih, WAVE.radius);
  const waves = Math.max(6, Math.round(S.total / WAVE.len));   // whole waves => seamless
  const n = Math.max(48, Math.round(S.total / WAVE.step));
  const pts = [];
  for(let i=0; i<n; i++){
    const s = S.total * i / n;
    const p = S.at(s);
    const off = WAVE.amp * Math.sin(2*Math.PI * waves * (s / S.total));
    pts.push([inset + p.x + p.nx*off, inset + p.y + p.ny*off]);
  }
  // Catmull-Rom through the samples, closed
  const g = i => pts[(i % n + n) % n];
  let d = `M ${g(0)[0].toFixed(2)} ${g(0)[1].toFixed(2)}`;
  for(let i=0; i<n; i++){
    const p0=g(i-1), p1=g(i), p2=g(i+1), p3=g(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C ${c1[0].toFixed(2)} ${c1[1].toFixed(2)}, ${c2[0].toFixed(2)} ${c2[1].toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
  }
  return d + ' Z';
}

function drawWave(){
  document.querySelectorAll('.tl-wave').forEach(svg=>{
    const panel = svg.parentElement;
    const w = Math.round(panel.offsetWidth), h = Math.round(panel.offsetHeight);
    if(!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    const d = wavePath(w, h);
    svg.innerHTML =
      `<path class="halo" d="${d}" fill="#f6e7d8" stroke="#fdf6ec" stroke-width="16" stroke-linejoin="round"/>` +
      `<path class="line" pathLength="1" d="${d}" fill="none" stroke="#f2a7a4" stroke-width="6.5" stroke-linejoin="round"/>`;
  });
}
if(window.ResizeObserver){
  const ro = new ResizeObserver(()=>drawWave());
  window.__waveRO = ro;
}
window.addEventListener('resize', drawWave);

let ARC_N = 0;
function arcHeading(txt){
  const id = 'arc' + (++ARC_N);
  // rises from the left, crests past the middle, eases down — matching the mockup
  const d = 'M 16 182 Q 302 68 604 104';
  return `<svg class="tl-headsvg" viewBox="0 0 620 190" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${txt}">
    <defs><path id="${id}" d="${d}" fill="none"></path></defs>
    <text text-anchor="middle"><textPath href="#${id}" startOffset="50%">${txt}</textPath></text>
  </svg>`;
}

/* Plays once, the first time the panel scrolls into view. A language switch
   re-renders the panel but never replays the draw. */
let REVEALED = matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window);
const revealIO = REVEALED ? null : new IntersectionObserver(entries=>{
  const hit = entries.find(e=>e.isIntersecting);
  if(!hit) return;
  REVEALED = true;
  revealIO.disconnect();
  const panel = hit.target;
  // wait for the webfonts so the panel doesn't change height mid-draw
  Promise.resolve(document.fonts && document.fonts.ready).then(()=>{
    drawWave();
    panel.addEventListener('animationend', function done(e){
      if(e.animationName !== 'tl-draw') return;
      panel.classList.remove('is-drawing');   // later redraws (resize) appear instantly
      panel.removeEventListener('animationend', done);
    });
    panel.classList.replace('is-pending', 'is-drawing');
  });
}, { threshold: 0.2 });

let LANG='en';
function render(){
  const t=COPY[LANG];
  document.documentElement.lang=LANG;
  document.getElementById('live').innerHTML=`
  <section class="tl-section">
    <img class="tl-star a" src="site-v4/assets/st1/star-green.webp" alt="">
    <img class="tl-star b" src="site-v4/assets/st1/star-pink.webp" alt="">
    <img class="tl-star c" src="site-v4/assets/st1/star-pink.webp" alt="">
    <img class="tl-star d" src="site-v4/assets/st1/star-green.webp" alt="">
    <div class="tl-panel${REVEALED ? '' : ' is-pending'}">
      <svg class="tl-wave" aria-hidden="true" preserveAspectRatio="none"></svg>
      <h2 class="tl-head">${arcHeading(t.head)}</h2>
      <p class="tl-note">${t.note}</p>
      <div class="tl-grid">
        ${t.items.map(i=>`
          <div class="tl-item">
            <img src="site-v4/assets/st1/${i[3]}.webp" alt="" loading="lazy">
            <div class="tl-time">${i[0]}</div>
            <div class="tl-name">${i[1]}</div>
            <p class="tl-desc">${i[2]}</p>
          </div>`).join('')}
      </div>
    </div>
  </section>`;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-current', b.dataset.lang===LANG?'true':'false'));
  drawWave();
  if(window.__waveRO){ document.querySelectorAll('.tl-panel').forEach(p=>window.__waveRO.observe(p)); }
  if(!REVEALED){ revealIO.disconnect(); document.querySelectorAll('.tl-panel').forEach(p=>revealIO.observe(p)); }
}
document.addEventListener('click',e=>{const b=e.target.closest('.lang button'); if(!b)return; LANG=b.dataset.lang; render();});
render();

})();
/* ---- stage 2 ---- */
(()=>{

const COPY = {
 en:{
  gate:{title:"You've got a mail!", label:'Invitation code', ph:'SABITOM'},
  hero:{kicker:'We are getting married!', names:'Sabi &amp; Tom', scroll:'Scroll down to rsvp'},
  cd:{pre:'Days until we say', quote:'“I do”', units:['days','hrs','min','s']}
 },

  hero:{kicker:'¡Nos casamos!', names:'Sabi &amp; Tom', scroll:'Formulario de asistencia al final de la página'},
  cd:{pre:'Días que faltan para decir', quote:'“Sí quiero”', units:['días','hrs','min','s']}
 }
};
const TARGET = new Date('2027-10-24T13:00:00+01:00');   // Atlantic/Canary, still WEST on 24 Oct
let LANG = 'en';

/* The envelope only exists inside the mockup image, so it is drawn. */
function envelopeSVG(){
  return `<svg class="envelope" viewBox="0 0 340 226" aria-hidden="true">
    <rect x="1" y="1" width="338" height="224" rx="6" fill="#f1e3d9"/>
    <path d="M1 7 L170 132 L339 7" fill="none" stroke="rgba(120,96,84,.30)" stroke-width="2"/>
    <path d="M1 219 L120 116" fill="none" stroke="rgba(120,96,84,.22)" stroke-width="2"/>
    <path d="M339 219 L220 116" fill="none" stroke="rgba(120,96,84,.22)" stroke-width="2"/>
    <circle cx="170" cy="118" r="30" fill="#c4697c"/>

/* ------------------------------------------------------------------
   Wavy shapes are generated, never stretched from a bitmap.
   wavyPath() walks the perimeter of a rounded rectangle and pushes
   each step alternately in and out, so the wobble keeps its amplitude
   whatever size the box ends up.
   ------------------------------------------------------------------ */
function wavyPath(w, h, amp, wave, inset){
  const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
  const edges = [
    {from:[x0,y0], to:[x1,y0], n:[0,-1]},
    {from:[x1,y0], to:[x1,y1], n:[1,0]},
    {from:[x1,y1], to:[x0,y1], n:[0,1]},
    {from:[x0,y1], to:[x0,y0], n:[-1,0]}
  ];
  let d = '', flip = 1, first = true;
  for(const e of edges){
    const dx = e.to[0]-e.from[0], dy = e.to[1]-e.from[1];
    const len = Math.hypot(dx,dy);
    let n = Math.max(2, Math.round(len/wave));
    if(n % 2) n++;                                   // keep the phase continuous
    if(first){ d += `M ${e.from[0].toFixed(1)} ${e.from[1].toFixed(1)}`; first = false; }
    for(let i=0;i<n;i++){
      const t0 = i/n, t1 = (i+1)/n, tm = (t0+t1)/2;
      const mx = e.from[0]+dx*tm + e.n[0]*amp*flip;
      const my = e.from[1]+dy*tm + e.n[1]*amp*flip;
      const px = e.from[0]+dx*t1, py = e.from[1]+dy*t1;
      d += ` Q ${mx.toFixed(1)} ${my.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
      flip = -flip;
    }
  }
  return d + ' Z';
}

/* a single wavy line, for the underline under the 07 heading */
function wavyLine(w, amp, wave){
  let n = Math.max(2, Math.round(w/wave)); if(n%2) n++;
  let d = `M 0 ${amp.toFixed(1)}`, flip = 1;
  for(let i=0;i<n;i++){
    const x1 = w*(i+1)/n, xm = w*(i+0.5)/n;
    d += ` Q ${xm.toFixed(1)} ${(amp - amp*flip).toFixed(1)} ${x1.toFixed(1)} ${amp.toFixed(1)}`;
    flip = -flip;
  }
  return d;
}

/* The underline is regenerated at the heading's real width, so the wave keeps
   its wavelength instead of being stretched to fit. */
function fitRule(){
  const word = document.querySelector('.trv-h .ul');
  if(!word) return;
  let svg = word.querySelector('.trv-rule');
  if(!svg){
    word.insertAdjacentHTML('beforeend', `<svg class="trv-rule" viewBox="0 0 300 16" aria-hidden="true">
      <path d="" fill="none" stroke="#f0a3a3" stroke-width="6" stroke-linecap="round"/></svg>`);
    svg = word.querySelector('.trv-rule');
  }
  const w = Math.max(80, Math.round(svg.getBoundingClientRect().width)) || 300;
  svg.setAttribute('viewBox', `0 0 ${w} 16`);
  svg.querySelector('path').setAttribute('d', wavyLine(w, 6, 190));
}

/* The frame is drawn at its real size for the same reason; its top edge sits
   half a line up from the heading's foot so the heading hides it. */
function fitFrame(){
  const svg = document.querySelector('.trv-frame'), h = document.querySelector('.trv-h');
  if(!svg || !h) return;
  // an <svg> is a replaced element: top+bottom / left+right don't stretch it, so size it here
  const inner = svg.parentElement, sec = inner.parentElement;
  const ri = inner.getBoundingClientRect(), rs = sec.getBoundingClientRect();
  if(!ri.width) return;                                  // hidden behind the gate; resize redraws it
  const margin = Math.max(8, rs.width * .05);
  const top = h.offsetTop + h.offsetHeight - parseFloat(getComputedStyle(h).lineHeight) * .5;
  const w = Math.round(Math.min(rs.width - 2 * margin, ri.width + 180));  // hug the text, as the mockup does
  const left = (ri.width - w) / 2;
  const ht = Math.round(ri.height + 30 - top);
  Object.assign(svg.style, {top: top + 'px', left: left + 'px', width: w + 'px', height: ht + 'px'});
  svg.setAttribute('viewBox', `0 0 ${w} ${ht}`);
  svg.querySelector('path').setAttribute('d', wavyPath(w, ht, 12, 170, 14));
}

/* ------------------------------------------------------------------
   Wavy shapes are generated, never stretched from a bitmap.
   Same helpers as stage 3: wavyPath() walks the perimeter of a box and
   pushes each step alternately in and out, so the wobble keeps its
   amplitude whatever size the box ends up.
   ------------------------------------------------------------------ */
function wavyPath(w, h, amp, wave, inset){
  const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
  const edges = [
    {from:[x0,y0], to:[x1,y0], n:[0,-1]},
    {from:[x1,y0], to:[x1,y1], n:[1,0]},
    {from:[x1,y1], to:[x0,y1], n:[0,1]},
    {from:[x0,y1], to:[x0,y0], n:[-1,0]}
  ];
  let d = '', flip = 1, first = true;
  for(const e of edges){
    const dx = e.to[0]-e.from[0], dy = e.to[1]-e.from[1];
    const len = Math.hypot(dx,dy);
    let n = Math.max(2, Math.round(len/wave));
    if(n % 2) n++;
    if(first){ d += `M ${e.from[0].toFixed(1)} ${e.from[1].toFixed(1)}`; first = false; }
    for(let i=0;i<n;i++){
      const t0 = i/n, t1 = (i+1)/n, tm = (t0+t1)/2;
      const mx = e.from[0]+dx*tm + e.n[0]*amp*flip;
      const my = e.from[1]+dy*tm + e.n[1]*amp*flip;
      const px = e.from[0]+dx*t1, py = e.from[1]+dy*t1;
      d += ` Q ${mx.toFixed(1)} ${my.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
      flip = -flip;
    }
  }
  return d + ' Z';
}
function wavyLine(w, amp, wave){
  let n = Math.max(2, Math.round(w/wave)); if(n%2) n++;
  let d = `M 0 ${amp.toFixed(1)}`, flip = 1;
  for(let i=0;i<n;i++){
    const x1 = w*(i+1)/n, xm = w*(i+0.5)/n;
    d += ` Q ${xm.toFixed(1)} ${(amp - amp*flip).toFixed(1)} ${x1.toFixed(1)} ${amp.toFixed(1)}`;
    flip = -flip;
  }
  return d;
}

/* The card border is regenerated at the card's measured size, so the wave
   keeps its wavelength instead of being stretched to fit. */
let frameObs;
function drawFrame(card){
  const svg = card.querySelector('.mn-frame');
  const w = Math.round(card.clientWidth), h = Math.round(card.clientHeight);
  if(!w || !h) return;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const amp = Math.max(5, Math.min(10, w/60)), wave = Math.max(38, Math.min(64, w/8));
  svg.querySelector('path').setAttribute('d', wavyPath(w, h, amp, wave, amp + 4));
}
function watchFrame(){
  const card = document.querySelector('.mn-card');
  if(!card) return;
  if(frameObs) frameObs.disconnect();
  if('ResizeObserver' in window){
    frameObs = new ResizeObserver(()=>drawFrame(card));
    frameObs.observe(card);
  } else {
    addEventListener('resize', ()=>drawFrame(card));
  }
  drawFrame(card);
}

    {from:[x0,y1], to:[x0,y0], n:[-1,0]}
  ];
  let d = '', flip = 1, first = true;
  for(const e of edges){
    const dx = e.to[0]-e.from[0], dy = e.to[1]-e.from[1];
    let n = Math.max(2, Math.round(Math.hypot(dx,dy)/wave)); if(n % 2) n++;
    if(first){ d += `M ${e.from[0].toFixed(1)} ${e.from[1].toFixed(1)}`; first = false; }
    for(let i=0;i<n;i++){
      const tm = (i+0.5)/n, t1 = (i+1)/n;
      const mx = e.from[0]+dx*tm + e.n[0]*amp*flip, my = e.from[1]+dy*tm + e.n[1]*amp*flip;
      d += ` Q ${mx.toFixed(1)} ${my.toFixed(1)} ${(e.from[0]+dx*t1).toFixed(1)} ${(e.from[1]+dy*t1).toFixed(1)}`;
      flip = -flip;
    }
  }
  return d + ' Z';
}
function wavyLine(w, amp, wave){
  let n = Math.max(2, Math.round(w/wave)); if(n%2) n++;
  let d = `M 0 ${amp.toFixed(1)}`, flip = 1;
  for(let i=0;i<n;i++){
    d += ` Q ${(w*(i+0.5)/n).toFixed(1)} ${(amp - amp*flip).toFixed(1)} ${(w*(i+1)/n).toFixed(1)} ${amp.toFixed(1)}`;
    flip = -flip;
  }
  return d;
}
/* A filled cream band whose top edge waves, laid over the bottom of the 15 photo. */
function waveBand(w, h, amp, wave){
  let n = Math.max(2, Math.round(w/wave)); if(n%2) n++;
  const base = amp + 2;
  let d = `M 0 ${base}`, flip = 1;
  for(let i=0;i<n;i++){
    d += ` Q ${(w*(i+0.5)/n).toFixed(1)} ${(base - 2*amp*flip).toFixed(1)} ${(w*(i+1)/n).toFixed(1)} ${base}`;
    flip = -flip;
  }
  return {fill: d + ` L ${w} ${h} L 0 ${h} Z`, line: d};
}

function fitShapes(){
  document.querySelectorAll('.wcard').forEach(card=>{
    const svg = card.querySelector('.wframe'); if(!svg) return;
    const w = Math.round(card.clientWidth), h = Math.round(card.clientHeight); if(!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const amp = Math.max(4, Math.min(9, w/60));
    svg.querySelector('.o').setAttribute('d', wavyPath(w, h, amp, Math.max(46, w/9), 8));
    svg.querySelector('.i').setAttribute('d', wavyPath(w, h, amp, Math.max(46, w/9), 15));
  });
  document.querySelectorAll('.g-rule').forEach(svg=>{
    const w = Math.max(60, Math.round(svg.getBoundingClientRect().width)) || 240;
    svg.setAttribute('viewBox', `0 0 ${w} 8`);
    svg.querySelector('path').setAttribute('d', wavyLine(w, 3, 14));
  });
  const ph = document.querySelector('.mu-photo svg');
  if(ph){
    const w = Math.max(200, Math.round(ph.getBoundingClientRect().width)) || 600, h = 30;
    ph.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const b = waveBand(w, h, 7, Math.max(40, w/14));
    ph.querySelector('.f').setAttribute('d', b.fill);
    ph.querySelector('.l').setAttribute('d', b.line);

    q1:{one:'¿Podrás acompañarnos en nuestra boda?', many:'¿Podréis acompañarnos en nuestra boda?'},
    yes:{one:'¡Sí, no me lo perdería!', many:'¡Sí, no nos lo perderíamos!'},
    no:{one:'Lo siento, no podré asistir.', many:'Lo siento, no podremos asistir.'},
    who:'¿Quiénes asistirán?',
    whoSub:'Selecciona las personas de esta invitación que podrán acompañarnos.',
    guest:n=>'Nombre del invitado '+n,
    all:'Seleccionar a todos',
    menuH:'Información sobre el menú',
    veg:'¿Prefieres menú vegetariano?', y:'Sí', n:'No',
    menuQ:'¿Qué menú prefieres?', menus:['Menú infantil','Menú de adulto','Menú vegetariano'],
    allerg:'¿Tienes alguna alergia o requisito dietético?',
    allergens:['Sin gluten / Celiaquía','Sin lactosa','Vegetariano','Vegano','Alergia a frutos secos','Alergia a marisco'],
    other:'Si tienes cualquier otra alergia, intolerancia o necesidad alimentaria, indícanosla aquí:',
    otherPh:'Ej. alergia al huevo, intolerancia a la fructosa, etc.',
    submit:'Enviar'
  }
 }
};

/* Prototype chrome — not site copy, deliberately English only. */
const PROTO = {
  ok:'Prototype — nothing is stored. This form has no backend: the submit was cancelled in the browser and no request was made.',
  errHead:'Prototype check — not site copy:',
  errAttend:'Answer the attendance question.',
  errWho:'Tick at least one guest.',
  errVeg:name=>'Answer the vegetarian question for '+name+'.',
  errMenu:name=>'Choose a menu for '+name+'.',
  band:{adult:'demo: adult', teen:'demo: 10–17', child:'demo: under 10'}
};

let LANG = 'en';
let GUESTS = 4;   // demo invitation size; the real list comes from the invitation code
/* Demo age band per guest (BOD-5). Never asked of the guest: in the real site it is
   derived from the guest list's dates of birth. adult = 18+, teen = 10–17, child = under 10. */
const BANDS = {4:['adult','adult','teen','child'], 1:['adult']};
const MENU_VALUES = ['children','adult','vegetarian'];

const CHEV = `<svg viewBox="0 0 18 12" aria-hidden="true"><path d="M2 3l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const HEART = `<svg viewBox="0 0 24 22" aria-hidden="true"><path class="fill" d="M12 20.5S2 14.2 2 7.6C2 4.5 4.4 2 7.3 2c2 0 3.6 1.1 4.7 2.8C13.1 3.1 14.7 2 16.7 2 19.6 2 22 4.5 22 7.6c0 6.6-10 12.9-10 12.9z" stroke-linejoin="round"/></svg>`;
const SPRIG = flip => `<svg viewBox="0 0 30 16" aria-hidden="true" style="${flip?'transform:scaleX(-1)':''}">
  <g fill="none" stroke="#9aae86" stroke-width="1.4" stroke-linecap="round">
  <path d="M2 8h26"/><path d="M9 8c2-4 5-5 7-5-1 3-4 5-7 5zM9 8c2 4 5 5 7 5-1-3-4-5-7-5zM18 8c2-3 4-4 6-4-1 2-3 4-6 4zM18 8c2 3 4 4 6 4-1-2-3-4-6-4z"/></g></svg>`;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- 16 ---------- */
function renderFAQ(t){
  const items = t.faq.map(([q,a],i)=>{
    const body = a === null ? t.faq1.join(' ') : a;
    return `<li><details data-i="${i}"><summary><span class="n">${i+1}.</span><span>${esc(q)}</span>${CHEV}</summary>
      <div class="ans"><p>${esc(body)}</p></div></details></li>`;
  }).join('');
  return `<section class="faq" aria-labelledby="faq-h">
    <img class="deco" src="site-v4/assets/st7/star-green-18.webp" alt="" style="height:min(64px,10cqw);left:7%;top:90px">
    <img class="deco" src="site-v4/assets/st7/star-pink-16.webp"  alt="" style="height:min(58px,9cqw);right:10%;top:56px">
    <img class="deco" src="site-v4/assets/st7/star-yellow-16.webp" alt="" style="height:min(54px,8.5cqw);right:4%;top:200px">
    <img class="deco" src="site-v4/assets/st7/star-pink-16.webp"  alt="" style="height:min(56px,8cqw);left:0;bottom:22%">
    <img class="deco" src="site-v4/assets/st7/star-green-18.webp" alt="" style="height:min(60px,9cqw);right:2%;bottom:6px">
    <div class="faq-sign">
      <img src="site-v4/assets/st7/frame-faqs.webp" width="698" height="560" alt="">
      <h2 class="faq-h" id="faq-h">${t.faqH}</h2>
    </div>
    <ol class="faq-list" role="list">${items}</ol>
  </section>`;
}

/* ---------- 17 · when panel (FAQ 1, verbatim, split by sentence) ---------- */
function renderWhen(t){
  const icons = ['icon-computer','icon-calendar','icon-whatsapp'];
  const rows = t.faq1.map((s,i)=>{
    let h = esc(s);
    if(h.includes(t.deadline)) h = h.replace(t.deadline, `<strong>${t.deadline}</strong>`);
    return `<li><img src="site-v4/assets/st7/${icons[i]}.webp" width="160" height="160" alt=""><p>${h}</p></li>`;
  }).join('');
  return `<section class="wr" aria-labelledby="wr-h">
    <div class="wr-card">
      <div class="wr-band"><h2 class="wr-h" id="wr-h">${esc(t.faq[0][0])}</h2></div>
      <ul class="wr-rows" role="list">${rows}</ul>
      <div class="wr-foot"><img src="site-v4/assets/st7/icon-heart-17.webp" width="189" height="80" alt=""></div>
    </div>
  </section>`;
}

/* ---------- 17 · form ---------- */
function guestBlock(r, n){
  const g = 'g'+n, band = BANDS[GUESTS][n-1];
  let q = '';
  if(band === 'adult') q = `<fieldset id="${g}-vegset">
      <legend class="rv-q">${esc(r.veg)} <span class="req" aria-hidden="true">*</span></legend>
      <div class="rv-opts">
        <label class="rv-opt"><input type="radio" id="${g}-veg-y" name="${g}-veg" value="yes">${esc(r.y)}</label>
        <label class="rv-opt"><input type="radio" id="${g}-veg-n" name="${g}-veg" value="no">${esc(r.n)}</label>
      </div>
    </fieldset>`;
  else if(band === 'teen') q = `<fieldset id="${g}-menuset">
      <legend class="rv-q">${esc(r.menuQ)} <span class="req" aria-hidden="true">*</span></legend>
      <div class="rv-opts">${r.menus.map((m,i)=>
        `<label class="rv-opt"><input type="radio" id="${g}-menu-${MENU_VALUES[i]}" name="${g}-menu" value="${MENU_VALUES[i]}">${esc(m)}</label>`).join('')}</div>
    </fieldset>`;
  /* child (under 10): children's menu automatically, no question */
  return `<fieldset class="rv-guest" data-g="${n}" data-band="${band}" ${GUESTS>1?'hidden':''}>
    <legend>${esc(r.guest(n))}</legend>
    <span class="demo-tag" title="Review chrome, not site copy: age band from the demo data">${esc(PROTO.band[band])}</span>
    ${q}
    <fieldset>
      <legend class="rv-q">${esc(r.allerg)}</legend>
      <div class="rv-allerg">${r.allergens.map((a,i)=>
        `<label class="rv-opt"><input type="checkbox" id="${g}-al${i}">${esc(a)}</label>`).join('')}</div>
    </fieldset>
    <div class="rv-other">
      <label for="${g}-other">${esc(r.other)}</label>
      <textarea id="${g}-other" placeholder="${esc(r.otherPh)}"></textarea>
    </div>
  </fieldset>`;
}

function renderForm(t){
  const r = t.rsvp, k = GUESTS>1 ? 'many' : 'one';
  const ids = Array.from({length:GUESTS},(_,i)=>i+1);
  const who = GUESTS>1 ? `<fieldset id="rv-who">
      <legend class="rv-q">${esc(r.who)}</legend>
      <p class="rv-sub">${esc(r.whoSub)}</p>
      <div class="rv-guests">
        ${ids.map(n=>`<label class="rv-opt"><input type="checkbox" class="rv-who" id="who-${n}" data-g="${n}">${esc(r.guest(n))}</label>`).join('')}
        <label class="rv-opt"><input type="checkbox" id="who-all">${esc(r.all)}</label>
      </div>
    </fieldset>` : '';
  return `<section class="rv" aria-labelledby="rv-h">
    <img class="deco" src="site-v4/assets/st7/star-green-18.webp" alt="" style="height:min(70px,10cqw);left:18%;top:96px">
    <img class="deco" src="site-v4/assets/st7/star-pink-16.webp"  alt="" style="height:min(80px,12cqw);left:5%;top:170px">
    <img class="deco" src="site-v4/assets/st7/star-yellow-18.webp" alt="" style="height:min(80px,12cqw);right:8%;top:70px">
    <img class="deco" src="site-v4/assets/st7/star-yellow-18.webp" alt="" style="height:min(74px,11cqw);left:3%;bottom:40px">
    <img class="deco" src="site-v4/assets/st7/star-green-18.webp" alt="" style="height:min(70px,10cqw);right:2%;bottom:110px">
    <img class="deco" src="site-v4/assets/st7/star-pink-16.webp"  alt="" style="height:min(68px,10cqw);right:9%;bottom:34px">
    <div class="rv-inner">
      <h2 class="rv-h" id="rv-h">${r.hPre?`<span class="pre">${esc(r.hPre)}</span>`:''}<span class="scr">${esc(r.h)}</span></h2>
      <img class="rv-stamp" src="site-v4/assets/st7/waxstamp.webp" width="578" height="220" alt="">
      <form class="rv-form" id="rsvp" novalidate onsubmit="return false">
        <fieldset id="rv-attend">
          <legend class="rv-q">${esc(r.q1[k])} <span class="req" aria-hidden="true">*</span></legend>
          <div class="rv-choices">
            <label class="rv-choice"><input type="radio" id="attend-y" name="attend" value="yes" required>${HEART}<span>${esc(r.yes[k])}</span></label>
            <label class="rv-choice"><input type="radio" id="attend-n" name="attend" value="no">${HEART}<span>${esc(r.no[k])}</span></label>
          </div>
        </fieldset>
        <div id="rv-going">
          ${who}
          <div id="rv-menu">
            <h3 class="rv-menu-h">${esc(r.menuH)}</h3>
            ${ids.map(n=>guestBlock(r,n)).join('')}
          </div>
        </div>
        <button class="rv-submit" type="submit">${SPRIG(false)}<span>${esc(r.submit)}</span>${SPRIG(true)}</button>
        <div class="rv-msg" id="rv-msg" role="status" aria-live="polite"></div>
      </form>
      <img class="rv-heart" src="site-v4/assets/st7/icon-heart-18.webp" width="67" height="80" alt="">
    </div>
  </section>`;
}

/* ---------- form behaviour ---------- */
function syncForm(){
  const form = document.getElementById('rsvp'); if(!form) return;
  const no = form.querySelector('#attend-n').checked;
  form.querySelector('#rv-going').hidden = no;
  const boxes = [...form.querySelectorAll('.rv-who')];
  if(boxes.length){
    boxes.forEach(b=>{ form.querySelector(`.rv-guest[data-g="${b.dataset.g}"]`).hidden = !b.checked; });
    const all = form.querySelector('#who-all'), on = boxes.filter(b=>b.checked).length;
    all.checked = on === boxes.length;
    all.indeterminate = on > 0 && on < boxes.length;
    form.querySelector('#rv-menu').hidden = on === 0;
  }
}

function validate(form){
  const t = COPY[LANG].rsvp, errs = [];
  form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));
  const attend = form.querySelector('input[name="attend"]:checked');
  if(!attend){ errs.push([PROTO.errAttend, form.querySelector('#rv-attend')]); }
  else if(attend.value === 'yes'){
    const boxes = [...form.querySelectorAll('.rv-who')];
    if(boxes.length && !boxes.some(b=>b.checked)) errs.push([PROTO.errWho, form.querySelector('#rv-who')]);
    form.querySelectorAll('.rv-guest:not([hidden])').forEach(g=>{
      const id = 'g'+g.dataset.g, name = t.guest(g.dataset.g);
      if(g.dataset.band === 'adult' && !g.querySelector(`input[name="${id}-veg"]:checked`))
        errs.push([PROTO.errVeg(name), g.querySelector(`#${id}-vegset`)]);
      else if(g.dataset.band === 'teen' && !g.querySelector(`input[name="${id}-menu"]:checked`))
        errs.push([PROTO.errMenu(name), g.querySelector(`#${id}-menuset`)]);
      /* child: nothing required */
    });
  }
  return errs;
}

document.addEventListener('submit', e=>{
  if(e.target.id !== 'rsvp') return;
  e.preventDefault();                       // nothing leaves the browser
  const form = e.target, msg = form.querySelector('#rv-msg');
  const errs = validate(form);
  if(errs.length){
    msg.className = 'rv-msg err';
    msg.innerHTML = `${PROTO.errHead}<ul>${errs.map(([m])=>`<li>${esc(m)}</li>`).join('')}</ul>`;
    errs.forEach(([,el])=>el && el.setAttribute('aria-invalid','true'));
    const first = errs[0][1] && errs[0][1].querySelector('input');
    if(first) first.focus();
    return;
  }
  msg.className = 'rv-msg';
  msg.textContent = PROTO.ok;
});

document.addEventListener('change', e=>{
  if(e.target.id === 'who-all'){
    document.querySelectorAll('.rv-who').forEach(b=>{ b.checked = e.target.checked; });
  }
  if(e.target.closest && e.target.closest('#rsvp')) syncForm();
});

/* Keep open FAQs and form input across a language switch or demo-size change. */
function snapshot(){
  const s = {open:[...document.querySelectorAll('.faq details[open]')].map(d=>d.dataset.i), f:{}};
  document.querySelectorAll('#rsvp input, #rsvp textarea').forEach(el=>{
    if(!el.id) return;
    s.f[el.id] = (el.type==='checkbox'||el.type==='radio') ? el.checked : el.value;
  });
  return s;
}
function restore(s){
  if(!s) return;
  s.open.forEach(i=>{ const d = document.querySelector(`.faq details[data-i="${i}"]`); if(d) d.open = true; });
  Object.entries(s.f).forEach(([id,v])=>{
    const el = document.getElementById(id); if(!el) return;
    if(el.type==='checkbox'||el.type==='radio') el.checked = v; else el.value = v;
  });
}

function render(){
  const snap = document.getElementById('s16').innerHTML ? snapshot() : null;
  const t = COPY[LANG];
  document.documentElement.lang = LANG;
  const sfx = LANG==='es' ? '-es' : '';
  document.getElementById('m16').src  = 'site-v4/assets/st7/mockup-16' + sfx + '.webp';
  document.getElementById('m17').src  = 'site-v4/assets/st7/mockup-17' + sfx + '.webp';
  document.getElementById('m17b').src = 'site-v4/assets/st7/mockup-18' + sfx + '.webp';

  document.getElementById('s16').innerHTML = renderFAQ(t);
  document.getElementById('s17').innerHTML = renderWhen(t) + renderForm(t);
  restore(snap);
  syncForm();

  document.querySelectorAll('.lang button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.lang===LANG ? 'true':'false'));
  document.querySelectorAll('.demo button').forEach(b=>
    b.setAttribute('aria-pressed', +b.dataset.guests===GUESTS ? 'true':'false'));
}

document.addEventListener('click', e=>{
  const b = e.target.closest('.lang button');
  if(b){ LANG = b.dataset.lang; render(); return; }
  const d = e.target.closest('.demo button');
  if(d){ GUESTS = +d.dataset.guests; render(); }
});
render();

})();

/* ---- page: dummy gate, shared by every stage ---- */
(()=>{
  // new key: browsers unlocked under the old any-code gate have to enter the real code
  const KEY = 'sabitom-open-v5';
  const HASH = 2841910431;
  const DENIED = {
    en: "Sorry, that code doesn't open this invitation. You're not able to see it.",
    es: 'Lo sentimos, ese código no abre esta invitación. No puedes verla.'
  };
  let denied = false;
  // FNV-1a, 32-bit; the build computes the same over GATE_CODE
  function gateHash(s){ let h = 0x811c9dc5; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h; }
  const lang = ()=> (document.querySelector('#top .lang button[aria-current="true"]') || {dataset:{lang:'en'}}).dataset.lang;
  const store = { get(){ try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; } },
                  set(v){ try{ v ? localStorage.setItem(KEY,'1') : localStorage.removeItem(KEY); }catch(e){} } };
  function open(){
    document.body.classList.add('open'); store.set(true);
    // sections laid out while hidden measured 0 wide; let them redraw their SVG shapes
    requestAnimationFrame(()=>dispatchEvent(new Event('resize')));
  }
  function lock(){ document.body.classList.remove('open'); store.set(false); denied = false; scrollTo(0,0); }
  function showDenied(){
    const f = document.querySelector('#s01 .field');
    if(!f) return;
    let m = f.querySelector('.gate-err');
    if(!denied){ if(m) m.remove(); return; }
    if(!m){ m = document.createElement('p'); m.className = 'gate-err'; m.setAttribute('role','alert'); f.appendChild(m); }
    m.textContent = DENIED[lang()] || DENIED.en;
  }
  function tryOpen(){
    const c = document.getElementById('code');
    if(!c) return;
    const v = c.value.replace(/\s+/g,'').toUpperCase();
    if(!v){ c.focus(); return; }
    if(gateHash(v) === HASH){ denied = false; showDenied(); open(); }
    else { denied = true; showDenied(); c.select(); }
  }
  // stage 2 re-renders the envelope on every language switch, so re-add the button each time
  function addGo(){
    const f = document.querySelector('#s01 .field');
    if(!f || f.querySelector('.gate-go')) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'gate-go'; b.textContent = '→';
    b.setAttribute('aria-label', (document.querySelector('#s01 label') || {}).textContent || 'Invitation code');
    f.appendChild(b);
    showDenied();   // re-render on a language switch: keep the message, in the new language
  }
  new MutationObserver(addGo).observe(document.getElementById('s01'), {childList:true});
  addGo();
  document.addEventListener('click', e=>{ if(e.target.closest('.gate-go')) tryOpen(); if(e.target.closest('#lock')) lock(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.id === 'code') tryOpen(); });
  document.addEventListener('input', e=>{ if(e.target.id === 'code' && denied){ denied = false; showDenied(); } });
  if(store.get()) open();
})();
</script>
